name: PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false

      - name: Check title length
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#PR_TITLE}" -gt 100 ]; then
            echo "PR title is ${#PR_TITLE} characters. The limit is 100."
            exit 1
          fi
